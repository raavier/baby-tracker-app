name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Ícones nativos do iOS
  cupertino_icons: ^1.0.8
  
  # ====== COMUNICAÇÃO HTTP - "O Sistema Telefônico" ======
  
  # Dio: Cliente HTTP poderoso e flexível
  # Por que Dio? Interceptors automáticos, retry logic, timeouts configuráveis
  # É como ter um "gerente de comunicações" muito eficiente
  dio: ^5.3.2
  
  # ====== GERENCIAMENTO DE ESTADO - "O Cérebro do App" ======
  
  # Riverpod: Estado reativo e dependency injection
  # Substitui Provider com melhor performance e dev experience
  # É como ter um "sistema nervoso" inteligente para o app
  flutter_riverpod: ^2.4.9
  
  # ====== ARMAZENAMENTO LOCAL - "O Cofre Digital" ======
  
  # SharedPreferences: Para token JWT e configurações simples
  # É onde guardamos o "crachá de acesso" do usuário
  shared_preferences: ^2.2.2
  
  # ====== NAVEGAÇÃO - "O Sistema de Transporte" ======
  
  # GoRouter: Navegação declarativa e type-safe
  # Melhor que Navigator tradicional para apps complexos
  go_router: ^12.1.3
  
  # ====== VALIDAÇÃO DE FORMULÁRIOS - "O Inspetor de Qualidade" ======
  
  # Formz: Validação de formulários reativa
  # Integra perfeitamente com Riverpod para estado de forms
  formz: ^0.6.1
  
  # ====== UTILITÁRIOS - "As Ferramentas Auxiliares" ======
  
  # Freezed: Classes imutáveis e union types
  # Para criar modelos de dados robustos e sem boilerplate
  freezed_annotation: ^2.4.1
  
  # JSON Annotation: Serialização JSON automática
  # Converte dados da API automaticamente em objetos Dart
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting para código limpo
  flutter_lints: ^5.0.0
  
  # ====== GERAÇÃO DE CÓDIGO - "Os Robôs Assistentes" ======
  
  # Build Runner: Executa geradores de código
  # É como ter um "assistente" que escreve código repetitivo
  build_runner: ^2.4.7
  
  # Freezed: Gerador de classes imutáveis
  freezed: ^2.4.6
  
  # JSON Serializable: Gerador de serialização JSON
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  # Aqui vamos adicionar assets futuramente:
  # assets:
  #   - images/
  #   - icons/